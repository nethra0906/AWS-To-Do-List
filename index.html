<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do</title>
  <meta name="description" content="A serverless to-do list backed by AWS Lambda, API Gateway, and DynamoDB." />
  <link rel="icon" type="image/png" href="Web-Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <p class="kicker">Lambda &middot; API Gateway &middot; DynamoDB</p>
      <h1>To&#8209;Do</h1>
      <p class="dateline" id="dateline"></p>
    </header>

    <form class="entry-row" id="taskForm">
      <label for="taskInput" class="field-label">New entry</label>
      <input
        id="taskInput"
        name="task"
        type="text"
        placeholder="Type a task and press enter&hellip;"
        maxlength="500"
        autocomplete="off"
        required
      />
      <button type="submit" id="addBtn">Add</button>
    </form>

    <div id="statusRegion" role="status" aria-live="polite" class="sr-only"></div>

    <ul id="taskList" class="ledger" aria-label="Tasks"></ul>

    <div class="rule"></div>

    <div class="statusbar">
      <span id="taskCount">0 tasks</span>
      <nav class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">Done</button>
      </nav>
      <button type="button" id="clearCompletedBtn" class="clear-completed">Clear&nbsp;completed</button>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
